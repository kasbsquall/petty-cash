[package]
name = "test-usd"
description = "Test dollars (tUSD) for the Petty Cash demo on NEAR testnet. Not a real stablecoin."
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/kasbsquall/petty-cash"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"
near-contract-standards = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
